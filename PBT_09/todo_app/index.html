<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App hoàn chỉnh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-wrapper">
        <h1>Thủy Lợi Todos</h1>
        
        <form id="todoForm" class="todo-form">
            <input type="text" id="todoInput" placeholder="Bạn cần làm gì tiếp theo?" autocomplete="off">
            <button type="submit" id="addBtn">Thêm</button>
        </form>

        <ul id="todoList" class="todo-list">
            </ul>

        <div class="todo-footer">
            <span id="todoCount">0 items left</span>
            <div class="filter-buttons">
                <button id="filterAll" class="filter-btn active">All</button>
                <button id="filterActive" class="filter-btn">Active</button>
                <button id="filterCompleted" class="filter-btn">Completed</button>
            </div>
            <button id="clearCompleted" class="clear-btn">Clear completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
