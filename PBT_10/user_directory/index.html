<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory (CRUD) - JSONPlaceholder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>

    <div class="app-container">
        <header>
            <h1>Quản Lý Danh Sách Người Dùng</h1>
            <div class="action-bar">
                <input type="text" id="search-input" placeholder="Tìm kiếm theo tên hoặc email...">
                <button id="open-add-modal-btn" class="btn btn-primary">+ Thêm User Mới</button>
            </div>
        </header>

        <main>
            <div id="user-list-container" class="grid-container">
                </div>
        </main>
    </div>

    <div id="user-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Thêm User Mới</h2>
            <form id="user-form">
                <input type="hidden" id="form-user-id">
                
                <div class="form-group">
                    <label for="form-name">Họ và tên:</label>
                    <input type="text" id="form-name" required placeholder="Nhập họ và tên...">
                </div>
                
                <div class="form-group">
                    <label for="form-email">Email:</label>
                    <input type="email" id="form-email" required placeholder="Nhập địa chỉ email...">
                </div>
                
                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
