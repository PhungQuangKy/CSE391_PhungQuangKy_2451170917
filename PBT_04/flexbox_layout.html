<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout - B2</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <!-- Phần 1: Navbar -->
    <nav class="navbar">
        <div class="logo">LOGO</div>
        
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="auth-buttons">
            <a href="#" class="btn">Login</a>
            <a href="#" class="btn">Register</a>
        </div>
    </nav>

    <!-- Phần 2: Product Cards Grid -->
    <div class="container">
        <div class="product-grid">
            <!-- Tạo 8 card sản phẩm -->
            <div class="card">
                <div class="card-img"></div>
                <div class="card-info">
                    <h3>Sản phẩm 1</h3>
                    <p class="price">500.000đ</p>
                </div>
                <button class="buy-btn">Mua ngay</button>
            </div>

            <!-- Copy thêm 7 card tương tự -->
            <div class="card"><div class="card-img"></div><div class="card-info"><h3>Sản phẩm 2</h3><p>400.000đ</p></div><button class="buy-btn">Mua ngay</button></div>
            <div class="card"><div class="card-img"></div><div class="card-info"><h3>Sản phẩm 3</h3><p>300.000đ</p></div><button class="buy-btn">Mua ngay</button></div>
            <div class="card"><div class="card-img"></div><div class="card-info"><h3>Sản phẩm 4</h3><p>600.000đ</p></div><button class="buy-btn">Mua ngay</button></div>
            <div class="card"><div class="card-img"></div><div class="card-info"><h3>Sản phẩm 5</h3><p>250.000đ</p></div><button class="buy-btn">Mua ngay</button></div>
            <div class="card"><div class="card-img"></div><div class="card-info"><h3>Sản phẩm 6</h3><p>700.000đ</p></div><button class="buy-btn">Mua ngay</button></div>
            <div class="card"><div class="card-img"></div><div class="card-info"><h3>Sản phẩm 7</h3><p>150.000đ</p></div><button class="buy-btn">Mua ngay</button></div>
            <div class="card"><div class="card-img"></div><div class="card-info"><h3>Sản phẩm 8</h3><p>900.000đ</p></div><button class="buy-btn">Mua ngay</button></div>
        </div>
    </div>

</body>
</html>
